<!doctype html>
<!-- Developer view: every scene with walkable ground (green), stand points (yellow = ok, red = off the ground) and the knight at near/far depth. -->
<html><body style="margin:0;background:#222;display:grid;grid-template-columns:repeat(4,400px);gap:4px"><pre id="o" style="color:#f66;grid-column:1/5;margin:0"></pre>
<script src="../art.js"></script><script src="../knight.js"></script><script>
var S = { f: {}, inv: ['shield'], scene: '' }; function has(i) { return S.inv.includes(i); }
for (const k of Object.keys(WALK)) {
  S.scene = k; const w = WALK[k]; let s = ART[k](S.f);
  for (const pl of w.polys) s += '<polygon points="' + pl.map(p => p.join(',')).join(' ') + '" fill="#0f03" stroke="#0f0"/>';
  for (const [key, v] of Object.entries(STAND)) {
    if (!key.startsWith(k + ':')) continue; const p = typeof v === 'function' ? v() : v; const ok = walkable(p[0], p[1], w);
    s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="' + (ok ? '#ff0' : '#f00') + '"/>';
    if (!ok) document.getElementById('o').textContent += 'OFF ' + key + '  ';
  }
  s += '<g transform="translate(' + w.spawn[0] + ' ' + w.spawn[1] + ') scale(' + depthScale(w.spawn[1]) + ')">' + knightSVG(0, false, true) + '</g>';
  const far = w.polys[0].reduce((a, b) => a[1] < b[1] ? a : b);
  s += '<g transform="translate(' + (far[0] + 12) + ' ' + (far[1] + 3) + ') scale(' + depthScale(far[1] + 3) + ')">' + knightSVG(1, true, false) + '</g>';
  document.write('<div style="color:#fff;font:12px sans-serif">' + k + '<svg width="400" height="250" viewBox="0 0 400 250">' + s + '</svg></div>');
}
</script></body></html>
